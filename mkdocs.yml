site_name: MiniLucene Tutorial
site_description: A chapter-oriented guide to lexical search mechanisms in miniature
site_url: https://system-in-miniature.github.io/mini-lucene/
repo_url: https://github.com/system-in-miniature/mini-lucene
repo_name: system-in-miniature/mini-lucene
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - English:
      - Chapter 1 · Quick start: index.md
      - Chapter 2 · Architecture overview:
          - Retrieval kernel: phase1-retrieval-kernel.md
          - Storage and commit: phase2-storage-commit.md
          - NRT mutation and merge: phase3-nrt-mutation.md
      - Chapter 3 · Mechanisms and Lucene mapping: lucene-mapping.md
      - Chapter 4 · Hands-on CLI experiment: labs-guide.md
      - Chapter 5 · Differences and behavior matrix: behavior-matrix.md
      - Appendix:
          - Segment format: segment-format.md
          - Final acceptance evidence: final-acceptance.md
  - 中文版:
      - 第 1 章 · 快速开始: zh/index.md
      - 第 2 章 · 架构总览:
          - 检索内核: zh/phase1-retrieval-kernel.md
          - 存储与提交: zh/phase2-storage-commit.md
          - NRT 变更与合并: zh/phase3-nrt-mutation.md
      - 第 3 章 · 机制与 Lucene 映射: zh/lucene-mapping.md
      - 第 4 章 · CLI 动手实验: zh/labs-guide.md
      - 第 5 章 · 差异与行为矩阵: zh/behavior-matrix.md
      - 附录:
          - 段格式: zh/segment-format.md
          - 最终验收证据: zh/final-acceptance.md
  - Design history archive · 设计历史存档:
      - Archive notice · 存档说明: superpowers/README.md
      - Reference-project design: superpowers/specs/2026-07-27-minilucene-reference-project-design.md
      - Reference-project plan: superpowers/plans/2026-07-27-minilucene-reference-project.md
      - Retrieval-kernel plan: superpowers/plans/2026-07-27-minilucene-retrieval-kernel.md
      - Storage-and-commit plan: superpowers/plans/2026-07-27-minilucene-storage-commit.md
      - NRT-mutation plan: superpowers/plans/2026-07-27-minilucene-nrt-mutation.md
      - Product-acceptance plan: superpowers/plans/2026-07-27-minilucene-product-acceptance.md
