site_name: MiniLucene Tutorial
site_description: A chapter-oriented guide to lexical search mechanisms in miniature
site_url: https://system-in-miniature.github.io/mini-lucene/
repo_url: https://github.com/system-in-miniature/mini-lucene
repo_name: system-in-miniature/mini-lucene
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - Tutorial:
      - Book contents: tutorial/index.md
      - 01 · Meet MiniLucene: tutorial/01-getting-started.md
      - 02 · The Analysis Chain: tutorial/02-analysis.md
      - 03 · The Inverted Index: tutorial/03-inverted-index.md
      - 04 · The Disk Codec: tutorial/04-codec.md
      - 05 · Segments and NRT: tutorial/05-segments-nrt.md
      - 06 · Deletes and Updates: tutorial/06-deletes-updates.md
      - 07 · Commit Atomicity: tutorial/07-commit-atomicity.md
      - 08 · Scoring and Top-K: tutorial/08-scoring.md
      - 09 · The Query Language: tutorial/09-query-language.md
      - 10 · Merge and Beyond: tutorial/10-merge-and-beyond.md
      - 11 · Doc-at-a-Time Execution: tutorial/11-daat.md
